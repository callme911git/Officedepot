<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareLink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CareLink</h1>

  <section id="caretaker-section">
    <h2>Register as a Caretaker</h2>
    <input id="caretaker-name" placeholder="Name" />
    <input id="caretaker-phone" placeholder="Phone" />
    <input id="caretaker-location" placeholder="Location" />
    <input id="caretaker-skills" placeholder="Skills" />
    <button onclick="registerCaretaker()">Register Caretaker</button>
  </section>

  <section id="patient-section">
    <h2>Register a Patient</h2>
    <input id="patient-name" placeholder="Name" />
    <input id="patient-phone" placeholder="Phone" />
    <input id="patient-location" placeholder="Location" />
    <input id="patient-needs" placeholder="Needs" />
    <button onclick="registerPatient()">Register Patient</button>
  </section>

  <section id="caretaker-list-section">
    <h2>Available Caretakers</h2>
    <ul id="caretaker-list"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
